# Render Blueprint - 一键部署配置
# 使用方式：Render Dashboard → Blueprint → 选择此文件
services:
  # 后端 Web Service - Flask API
  - type: web
    name: qknews-api
    runtime: python
    plan: free
    buildCommand: pip install -r news_dashboard/requirements.txt
    startCommand: cd news_dashboard && gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 60 wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CORS_ORIGINS
        value: "*"
      # 以下变量需在 Render Dashboard 手动设置（敏感信息）
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false

  # 前端 Static Site
  - type: static
    name: qknews-web
    runtime: static
    plan: free
    buildCommand: cd app && npm install && npm run build
    staticPublishPath: app/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://qknews-api.onrender.com

jobs:
  # 爬虫定时任务 - 每20分钟抓取一次新闻
  - type: cron
    name: qknews-crawler
    runtime: python
    plan: free
    buildCommand: pip install -r news_dashboard/requirements.txt
    schedule: "*/20 * * * *"
    startCommand: cd news_dashboard && python cron_fetch.py
    envVars:
      # 以下变量需在 Render Dashboard 手动设置（与 Web Service 相同）
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false

  # 热点话题更新 - 每小时执行一次
  - type: cron
    name: qknews-topics
    runtime: python
    plan: free
    buildCommand: pip install -r news_dashboard/requirements.txt
    schedule: "0 * * * *"
    startCommand: cd news_dashboard && python cron_topics.py
    envVars:
      # 以下变量需在 Render Dashboard 手动设置（与 Web Service 相同）
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
